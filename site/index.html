<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AKIJ Resource — Network Monitoring</title>
<link rel="icon" href="assets/akij-essential-logo.jpg" type="image/jpeg">
<style>
  :root { --bg:#0f1420; --card:#1a2233; --line:#2a3547; --txt:#e6edf7; --mut:#8fa1bd; --ok:#2ecc71; --off:#e74c3c; --acc:#4a8fe0; --warn:#f39c12; --ubi:#00a3e0; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt); font-family:'Segoe UI',Arial,sans-serif; padding:20px; }
  /* ---- app top bar (single row) ---- */
  .appbar { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 16px; margin-bottom:18px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .brand { display:flex; align-items:center; text-decoration:none; cursor:pointer; }
  .brandlogo { height:46px; width:auto; display:block; border-radius:8px; }
  .searchwrap { flex:0 1 280px; min-width:170px; position:relative; }
  .searchwrap input { width:100%; background:var(--bg); border:1px solid var(--line); color:var(--txt); padding:10px 14px 10px 38px; border-radius:8px; font-size:14px; outline:none; }
  .searchwrap input:focus { border-color:var(--acc); }
  .searchwrap .ic { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--mut); }
  .btn { background:var(--acc); color:#fff; border:none; padding:10px 18px; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; }
  .btn:hover { filter:brightness(1.1); }
  .addbtn { white-space:nowrap; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .chips.end { margin-left:auto; }
  .chip { background:var(--bg); border:1px solid var(--line); padding:6px 13px; border-radius:20px; font-size:13px; color:var(--mut); }
  .chip b { color:var(--txt); }
  .chip.on b { color:var(--ok); }
  .chip.off b { color:var(--off); }
  .chip.alert { color:var(--warn); }
  .chip.alert b { color:var(--warn); }
  .chip.live { color:var(--ok); }
  .chip.filterable { cursor:pointer; user-select:none; transition:border-color .15s, background .15s; }
  .chip.filterable:hover { border-color:var(--acc); }
  .livedot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--ok); margin-right:6px; box-shadow:0 0 6px var(--ok); animation:pulse 1.6s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
  .user { display:flex; align-items:center; gap:10px; padding:3px 8px 3px 14px; border-left:1px solid var(--line); margin-left:4px; }
  .uavatar { width:36px; height:36px; border-radius:50%; background:var(--acc); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; }
  .uinfo { line-height:1.2; }
  .uname { font-size:14px; font-weight:600; }
  .urole { font-size:11px; color:var(--mut); }
  @media(max-width:900px){ .searchwrap{flex-basis:100%; order:3} }
  /* ---- categories ---- */
  .cathead { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:24px 0 12px; padding-bottom:8px; border-bottom:2px solid var(--line); }
  .cathead h2 { font-size:17px; font-weight:600; color:var(--acc); }
  .cathead .ccount { font-size:12px; color:var(--mut); }
  .cat { display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); gap:12px; }
  @media(max-width:1400px){ .cat{grid-template-columns:repeat(4, minmax(0, 1fr));} }
  @media(max-width:1100px){ .cat{grid-template-columns:repeat(3, minmax(0, 1fr));} }
  @media(max-width:820px){ .cat{grid-template-columns:repeat(2, minmax(0, 1fr));} }
  @media(max-width:520px){ .cat{grid-template-columns:1fr;} }
  .devcard { background:var(--card); border:1px solid var(--line); border-radius:10px; cursor:pointer; transition:border-color .15s; }
  .devcard:hover { border-color:var(--acc); }
  .devcard.off { opacity:.78; }
  .devhead { padding:12px 14px; display:flex; align-items:center; gap:12px; }
  .stDot { width:12px; height:12px; border-radius:50%; flex:0 0 auto; }
  .stDot.on { background:var(--ok); box-shadow:0 0 8px var(--ok); }
  .stDot.off { background:var(--off); box-shadow:0 0 8px var(--off); }
  .devinfo { flex:1; min-width:0; }
  .devname { font-weight:600; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .devsub { font-size:11px; color:var(--mut); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .devstat { font-size:11px; font-weight:700; padding:4px 10px; border-radius:6px; flex:0 0 auto; }
  .devstat.on { background:rgba(46,204,113,.15); color:var(--ok); }
  .devstat.off { background:rgba(231,76,60,.15); color:var(--off); }
  .chint { color:var(--mut); font-size:16px; flex:0 0 auto; }
  .vtag { display:inline-block; font-size:10px; font-weight:700; padding:2px 7px; border-radius:10px; margin-left:6px; vertical-align:middle; }
  .vtag.mt { background:rgba(74,143,224,.15); color:var(--acc); }
  .vtag.ub { background:rgba(0,163,224,.15); color:var(--ubi); }
  .vtag.cb { background:rgba(242,156,23,.15); color:var(--warn); }
  .foot { margin-top:18px; color:var(--mut); font-size:12px; text-align:center; }
  .empty { color:var(--mut); font-size:13px; margin-top:24px; text-align:center; }
  /* ---- modal ---- */
  .ov { display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:50; align-items:center; justify-content:center; padding:20px; }
  .ov.show { display:flex; }
  .modal { background:var(--card); border:1px solid var(--line); border-radius:12px; width:100%; max-width:680px; padding:20px; max-height:86vh; overflow:auto; }
  .modal h3 { margin-bottom:14px; font-size:17px; }
  .meta { display:grid; grid-template-columns:1fr 1fr; gap:8px 12px; font-size:12px; margin-bottom:12px; }
  .meta .lbl { color:var(--mut); }
  .meta .val { font-family:Consolas,monospace; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th,td { text-align:left; padding:6px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--mut); font-weight:600; }
  tr:last-child td { border-bottom:none; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
  .dot.up { background:var(--ok); }
  .dot.down { background:var(--off); }
  .scroll { max-height:340px; overflow:auto; border:1px solid var(--line); border-radius:8px; }
  /* ---- NVR page: header + info row + HDD block + gauges ---- */
  #nvrView { display:none; }
  body.nvr-mode .homeonly, body.nvr-mode .homechip { display:none !important; }
  body.nvr-mode .morebtn { display:inline-flex !important; }
  .nvrcard { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:16px; }
  .nvrhead-row { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .back { color:var(--acc); font-weight:600; font-size:13px; cursor:pointer; }
  .back:hover { text-decoration:underline; }
  .nvrtitle { font-size:20px; font-weight:700; }
  .nvronline { margin-left:auto; font-size:12px; font-weight:700; padding:5px 12px; border-radius:6px; background:rgba(46,204,113,.15); color:var(--ok); }
  .nvronline.off { background:rgba(231,76,60,.15); color:var(--off); }
  .infogrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(135px,1fr)); gap:12px; margin-top:16px; padding-top:16px; border-top:1px solid var(--line); }
  .infogrid .lbl { font-size:10px; color:var(--mut); text-transform:uppercase; letter-spacing:.5px; }
  .infogrid .val { font-size:14px; margin-top:5px; font-family:Consolas,monospace; word-break:break-all; }
  .infogrid .val.green { color:var(--ok); }
  .infogrid .val.red { color:var(--off); }
  .monrow { display:flex; gap:14px; flex-wrap:wrap; align-items:stretch; margin-bottom:16px; }
  .hddblock { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; flex:2; min-width:320px; }
  .hddtitle { font-size:12px; color:var(--mut); text-transform:uppercase; letter-spacing:.5px; }
  .hddtitle b { color:var(--txt); margin-left:6px; }
  .hddgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:10px; margin-top:14px; }
  .hdd { background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:11px 12px; }
  .hdd.connected { border-color:rgba(46,204,113,.4); }
  .hdd .hname { font-weight:700; font-size:13px; }
  .hdd .hcap { font-size:11px; color:var(--mut); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hdd .hst { display:inline-block; font-size:10px; font-weight:700; padding:2px 8px; border-radius:10px; margin-top:8px; }
  .hdd .hst.healthy { background:rgba(46,204,113,.15); color:var(--ok); }
  .hdd .hst.empty { background:rgba(143,161,189,.15); color:var(--mut); }
  .hdd .hst.warning { background:rgba(243,156,18,.15); color:var(--warn); }
  .gaugeblock { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px 16px; flex:1; min-width:300px; display:flex; gap:34px; align-items:center; justify-content:center; flex-wrap:wrap; }
  .gauge { text-align:center; }
  .ring { --p:0; --c:#3a4357; width:84px; height:84px; border-radius:50%; background:conic-gradient(var(--c) calc(var(--p)*1%), rgba(255,255,255,.08) 0); display:flex; align-items:center; justify-content:center; position:relative; margin:0 auto; }
  .ring::before { content:''; position:absolute; inset:9px; background:var(--card); border-radius:50%; }
  .ring span { position:relative; font-size:16px; font-weight:700; }
  .glabel { font-size:11px; color:var(--mut); text-transform:uppercase; letter-spacing:.4px; margin-top:9px; }
  .gsub { font-size:10px; color:var(--mut); margin-top:3px; }
  .camwrap { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; }
  .camnav { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .navbtn { background:var(--bg); border:1px solid var(--line); color:var(--mut); padding:7px 13px; border-radius:8px; font-size:12px; cursor:pointer; }
  .navbtn:hover { border-color:var(--acc); color:var(--txt); }
  .navbtn.active { background:var(--acc); color:#fff; border-color:var(--acc); }
  .navbtn.dis { opacity:.45; cursor:default; }
  .navbtn.dis:hover { border-color:var(--line); color:var(--mut); }
  .camsearch { flex:1; min-width:170px; }
  .camsearch input, .camnav select { width:100%; background:var(--bg); border:1px solid var(--line); color:var(--txt); padding:8px 12px; border-radius:8px; font-size:13px; outline:none; }
  .camnav .count { font-size:12px; color:var(--mut); white-space:nowrap; }
  .camgrid { display:grid; grid-template-columns:repeat(5, minmax(0,1fr)); gap:12px; }
  @media(max-width:1400px){ .camgrid{grid-template-columns:repeat(4, minmax(0,1fr));} }
  @media(max-width:1100px){ .camgrid{grid-template-columns:repeat(3, minmax(0,1fr));} }
  @media(max-width:820px){ .camgrid{grid-template-columns:repeat(2, minmax(0,1fr));} }
  @media(max-width:520px){ .camgrid{grid-template-columns:1fr;} }
  .camcard { background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:12px; }
  .camcard.off { opacity:.75; }
  .camcard-head { display:flex; align-items:center; justify-content:space-between; }
  .camch { font-size:11px; font-weight:700; color:var(--acc); background:rgba(74,143,224,.14); padding:3px 8px; border-radius:8px; }
  .camdot { width:10px; height:10px; border-radius:50%; }
  .camdot.on { background:var(--ok); box-shadow:0 0 6px var(--ok); }
  .camdot.off { background:var(--off); box-shadow:0 0 6px var(--off); }
  .camname { font-size:13px; font-weight:600; margin-top:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .camip { font-size:11px; color:var(--mut); margin-top:3px; font-family:Consolas,monospace; }
  .camtags { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .camtag { font-size:9px; font-weight:700; letter-spacing:.05em; padding:3px 8px; border-radius:20px; }
  .camtag.rec { background:rgba(46,204,113,.15); color:var(--ok); }
  .camtag.rec.idle { background:rgba(143,161,189,.15); color:var(--mut); }
  .camtag.on { background:rgba(46,204,113,.15); color:var(--ok); }
  .camtag.off { background:rgba(231,76,60,.15); color:var(--off); }
  .refreshfab { position:fixed; right:22px; bottom:22px; background:var(--card); border:1px solid var(--line); color:var(--txt); padding:12px 18px; border-radius:24px; font-size:13px; font-weight:600; cursor:pointer; box-shadow:0 10px 30px rgba(0,0,0,.5); display:none; z-index:20; }
  .refreshfab:hover { border-color:var(--acc); color:var(--acc); }
  .refreshfab.show { display:block; }
  /* ---- device detail (switch/router) ---- */
  .sectitle { font-size:13px; font-weight:700; color:var(--acc); margin-bottom:12px; }
  .histctl { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:14px; }
  .histctl select { background:var(--bg); border:1px solid var(--line); color:var(--txt); padding:8px 12px; border-radius:8px; font-size:13px; min-width:190px; outline:none; }
  .ranges { display:flex; gap:6px; margin-left:auto; }
  .rbtn { background:var(--bg); border:1px solid var(--line); color:var(--mut); padding:7px 14px; border-radius:8px; font-size:12px; cursor:pointer; }
  .rbtn:hover { border-color:var(--acc); color:var(--txt); }
  .rbtn.active { background:var(--acc); color:#fff; border-color:var(--acc); }
  .chartbox { height:320px; background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:12px; position:relative; }
  .itable { border:1px solid var(--line); border-radius:8px; overflow:auto; max-height:430px; }
  .dim { color:var(--mut); }
  .fld { margin-bottom:12px; }
  .fld label { display:block; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em; color:#8fa1bd; margin-bottom:5px; }
  .fld input, .fld select { width:100%; background:var(--bg); border:1px solid var(--line); color:var(--txt); padding:10px 12px; border-radius:8px; font-size:13px; outline:none; }
  .fld input:focus, .fld select:focus { border-color:var(--acc); }
  .mbtns { display:flex; gap:10px; margin-top:14px; justify-content:flex-end; }
  .btn.gray { background:var(--line); }
  .msg { margin-top:8px; font-size:12px; }
  .frow { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--card); border:1px solid var(--line); color:var(--txt); padding:10px 16px; border-radius:10px; font-size:13px; display:none; z-index:60; box-shadow:0 12px 30px rgba(0,0,0,.5); }
  .toast.show { display:block; }
</style>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<header class="appbar">
  <a class="brand" href="#" title="AKIJ Resource"><img src="assets/akij-essential-logo.jpg" alt="AKIJ Resource" class="brandlogo"></a>
  <div class="searchwrap homeonly">
    <span class="ic">&#128269;</span>
    <input id="search" type="text" placeholder="Search Device by Name or IP" oninput="doSearch()">
  </div>
  <button class="btn addbtn homeonly" onclick="openAddDevice()">+ Add Device</button>
  <div class="chips end">
    <span class="chip homechip" id="clockChip" title="Live time"><span style="color:var(--mut)">&#128336;</span> <b id="clock">--</b></span>
    <span class="chip alert filterable homechip" onclick="showDevList('offline')" title="Show offline devices">&#128276; Alerts <b id="chipAlerts">0</b></span>
    <span class="chip filterable homechip" onclick="showDevList('all')" title="Show all devices">Total <b id="stTotal">0</b></span>
    <span class="chip on filterable homechip" onclick="showDevList('online')" title="Show online devices">Online <b id="stOn">0</b></span>
    <span class="chip off filterable homechip" onclick="showDevList('offline')" title="Show offline devices">Offline <b id="stOff">0</b></span>
    <span class="chip filterable homechip" onclick="showCamList('all')" title="Show all cameras">Total Cam <b id="stTotalCam">0</b></span>
    <span class="chip on filterable homechip" onclick="showCamList('online')" title="Show online cameras">Online Cam <b id="stOnCam">0</b></span>
    <span class="chip off filterable homechip" onclick="showCamList('offline')" title="Show offline cameras">Offline Cam <b id="stOffCam">0</b></span>
    <span class="chip live"><span class="livedot"></span>Live</span>
    <span class="chip morebtn" style="display:none;cursor:pointer">More &#9662;</span>
    <span class="chip homechip" style="opacity:.7">Updated <b id="stUpd">--</b></span>
    <div class="user">
      <div class="uavatar">M</div>
      <div class="uinfo"><div class="uname">Munna</div><div class="urole">admin</div></div>
    </div>
  </div>
</header>

<div id="main"><div class="empty">Loading…</div></div>
<div id="nvrView"></div>
<button class="refreshfab" id="refreshFab" onclick="reloadNow()">&#8635; Refresh</button>
<div class="foot">Data refreshed via GitHub Actions every 5 min &middot; AKIJ Resource Network Monitoring</div>

<div class="ov" id="detailOv" onclick="if(event.target===this)closeDetail()">
  <div class="modal" style="max-width:1000px">
    <div style="display:flex;align-items:center;justify-content:space-between">
      <h3 id="detailTitle" style="margin:0">Device</h3>
      <button class="btn" style="background:var(--line)" onclick="closeDetail()">Close</button>
    </div>
    <div id="detailBody" style="margin-top:14px"></div>
  </div>
</div>

<div class="ov" id="listOv" onclick="if(event.target===this)closeList()">
  <div class="modal" style="max-width:920px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <h3 id="listTitle" style="margin:0">List</h3>
      <button class="btn" style="background:var(--line)" onclick="closeList()">Close</button>
    </div>
    <div id="listBody"></div>
  </div>
</div>

<div class="ov" id="addOv" onclick="if(event.target===this)closeAddDevice()">
  <div class="modal" style="max-width:560px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <h3 style="margin:0">Add Device</h3>
      <button class="btn gray" onclick="closeAddDevice()">Close</button>
    </div>
    <div class="frow">
      <div class="fld"><label>ID</label><input id="adId" placeholder="e.g. ael-sw04"></div>
      <div class="fld"><label>Name *</label><input id="adName" placeholder="e.g. AEL-SW04"></div>
    </div>
    <div class="frow">
      <div class="fld"><label>ISP / Type</label><input id="adIsp" placeholder="e.g. Switch"></div>
      <div class="fld"><label>Location</label><input id="adLoc" placeholder="e.g. FLOUR-CCR"></div>
    </div>
    <div class="frow">
      <div class="fld"><label>IP Address *</label><input id="adIp" placeholder="e.g. 103.102.42.59"></div>
      <div class="fld"><label>Check Type</label><select id="adType"><option value="">SNMP</option><option value="ping">ping (NVR / ping)</option></select></div>
    </div>
    <div class="frow">
      <div class="fld"><label>SNMP Port</label><input id="adSnmpPort" placeholder="default 161 (e.g. 16101)"></div>
      <div class="fld"><label>NVR Port</label><input id="adNvrPort" placeholder="NVR only (e.g. 2581)"></div>
    </div>
    <div class="frow">
      <div class="fld"><label>Device-User</label><input id="adUser" placeholder="NVR / ISAPI user"></div>
      <div class="fld"><label>Device-Pass</label><input id="adPass" type="password"></div>
    </div>
    <div class="msg" id="adMsg" style="min-height:16px"></div>
    <div class="mbtns">
      <button class="btn gray" onclick="closeAddDevice()">Cancel</button>
      <button class="btn" onclick="submitAddDevice()">Add Device</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const esc = s => String(s == null ? '--' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CATS = [
  { key:'mikrotik', label:'MikroTik Routers', icon:'&#128241;' },
  { key:'ubiquiti', label:'Ubiquiti Routers', icon:'&#128241;' },
  { key:'switch',   label:'Network Switches',     icon:'&#128450;' },
  { key:'nvr',      label:'NVR / CCTV',       icon:'&#127909;' },
  { key:'other',    label:'Other Devices',    icon:'&#128268;' },
  { key:'ping',     label:'Attendance Devices', icon:'&#128247;' }
];
let searchQ = '';
let DATA = null;

function catOf(r){
  if (r.type === 'ping' && (r.isp||'').toLowerCase().indexOf('nvr') >= 0) return 'nvr';
  if (r.type === 'ping') return 'ping';
  if ((r.isp||'').toLowerCase().indexOf('switch') >= 0) return 'switch';
  if (r.vendor === 'ubiquiti') return 'ubiquiti';
  if (r.vendor === 'mikrotik') return 'mikrotik';
  return 'other';
}
function brandOf(r){
  if (r.vendor === 'ubiquiti') return { label:'Ubiquiti', cls:'ub' };
  if (r.vendor === 'mikrotik') return { label:'MikroTik', cls:'mt' };
  if (r.vendor === 'cisco')    return { label:'Cisco', cls:'cb' };
  if ((r.isp||'').toLowerCase().indexOf('switch') >= 0) return { label:'Switch', cls:'cb' };
  return null;
}
function vtagHtml(r){ const b = brandOf(r); return b ? '<span class="vtag '+b.cls+'">'+b.label+'</span>' : ''; }

function fmtUptime(sec){
  if (sec == null) return '--';
  let s = Math.floor(sec), d = Math.floor(s/86400); s -= d*86400;
  const h = Math.floor(s/3600), m = Math.floor((s - h*3600)/60);
  if (d > 0) return d + 'd ' + h + 'h';
  if (h > 0) return h + 'h ' + m + 'm';
  return m + 'm';
}
function fmtSize(mb){

function drawChart(){
  if (!CUR_DEV) return;
  const sel = document.getElementById('ifSel');
  const idx = sel ? sel.value : null;
  const dev = (HIST && HIST.devices && HIST.devices[CUR_DEV.id]) ? HIST.devices[CUR_DEV.id] : {};
  const ser = dev[idx] || { name: '', pts: [] };
  const ranges = { '1H': 3600e3, '6H': 6*3600e3, '12H': 12*3600e3, '24H': 24*3600e3 };
  const cutoff = Date.now() - (ranges[CUR_RANGE] || 24*3600e3);
  const pts = (ser.pts || []).filter(p => p[0] >= cutoff);
  const labels = pts.map(p => { const d = new Date(p[0]); return ('0'+d.getHours()).slice(-2) + ':' + ('0'+d.getMinutes()).slice(-2) + ':' + ('0'+d.getSeconds()).slice(-2); });
  const rx = pts.map(p => p[1] == null ? null : +(p[1]/1e6).toFixed(3));
  const tx = pts.map(p => p[2] == null ? null : +(p[2]/1e6).toFixed(3));
  const canvas = document.getElementById('chart');
  if (!canvas || typeof Chart === 'undefined') return;
  if (CHART) { CHART.destroy(); CHART = null; }
  CHART = new Chart(canvas, {
    type: 'line',
    data: { labels: labels, datasets: [
      { label: 'RX ' + (ser.name || ''), data: rx, borderColor: '#4a8fe0', backgroundColor: 'rgba(74,143,224,.12)', borderWidth: 2, pointRadius: 0, tension: .3, spanGaps: true },
      { label: 'TX ' + (ser.name || ''), data: tx, borderColor: '#2ecc71', backgroundColor: 'rgba(46,204,113,.12)', borderWidth: 2, pointRadius: 0, tension: .3, spanGaps: true }
    ] },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false,
      plugins: { legend: { labels: { color: '#8fa1bd', boxWidth: 12 } } },
      scales: {
        x: { ticks: { color: '#8fa1bd', maxTicksLimit: 8 }, grid: { color: 'rgba(255,255,255,.05)' } },
        y: { beginAtZero: true, ticks: { color: '#8fa1bd', callback: v => v + ' Mbps' }, grid: { color: 'rgba(255,255,255,.05)' } }
      }
    }
  });
}

      list.map(c => '<tr><td>' + esc(c.nvr) + '</td><td>' + esc(c.ch) + '</td><td>' + esc(c.name) + '</td><td>' + esc(c.ip) + '</td>' +
        '<td style="color:var(--mut)">' + esc(c.model) + '</td>' +
        '<td><span class="dot ' + (c.online === true ? 'up' : 'down') + '"></span>' + (c.online === true ? 'Online' : (c.online === false ? 'Offline' : 'Unknown')) + '</td></tr>').join('') +
      '</tbody></table></div>'
    : '<div class="empty" style="margin:16px 0">No cameras.</div>';
  document.getElementById('listOv').classList.add('show');
}
function closeList(){ document.getElementById('listOv').classList.remove('show'); }

// ---- live clock (dd/mm/yyyy hh:mm:ss) ----
function tick(){
  const d = new Date();
  const p = n => String(n).padStart(2, '0');
  const el = document.getElementById('clock');
  if (el) el.textContent = p(d.getDate()) + '/' + p(d.getMonth()+1) + '/' + d.getFullYear() + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}
tick(); setInterval(tick, 1000);

async function load(){
  try {
    const r = await fetch('data.json?_=' + Date.now(), { cache:'no-store' });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    DATA = await r.json();
    try { const h = await fetch('history.json?_=' + Date.now(), { cache:'no-store' }); if (h.ok) HIST = await h.json(); } catch(e) {}
    if (CUR_NVR && DATA.nvrs && DATA.nvrs[CUR_NVR.id]) openNvrView(DATA.nvrs[CUR_NVR.id]);
    else if (CUR_DEV) { const dd = (DATA.devices||[]).find(x => x.id === CUR_DEV.id); if (dd) openDevView(dd); else render(); }
    else render();
  } catch(e){
    document.getElementById('main').innerHTML = '<div class="empty">Could not load data.json ('+esc(e.message)+'). The Monitor workflow may not have run yet.</div>';
  }
}
load();
setInterval(load, 60000);
</script>
