<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Network Operation Center — secure sign in" />
  <title>Sign In — Network Operation Center</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="icon" href="../assets/akij-essential-logo.jpg" type="image/jpeg" />
</head>
<body>
  <div class="login-root">
    <div class="login-orb" aria-hidden="true"></div>
    <canvas class="login-fx" id="fx" aria-hidden="true"></canvas>

    <div class="login-wrap">
      <div class="login-card">
        <div class="login-top"></div>

        <form class="login-form" id="login-form" novalidate>
          <div class="login-logo" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
              <path d="M3 6h18"></path>
              <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>
          </div>

          <div class="login-head">
            <h1>Network Operation Center</h1>
            <p>Sign in to your account</p>
          </div>

          <div class="login-field">
            <label class="login-label" for="username">Username</label>
            <input id="username" name="username" class="login-input" type="text"
                   placeholder="Username" autocomplete="username" autocapitalize="none" spellcheck="false" />
          </div>

          <div class="login-field">
            <label class="login-label" for="password">Password</label>
            <div class="login-pass">
              <input id="password" name="password" class="login-input" type="password"
                     placeholder="••••••••" autocomplete="current-password" />
              <button type="button" id="eye" class="login-eye" aria-label="Show password" aria-pressed="false">
                <svg id="eyeOpen" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
                <svg id="eyeOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" style="display:none">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                  <line x1="1" y1="1" x2="23" y2="23"></line>
                </svg>
              </button>
            </div>
          </div>

          <div class="login-error" id="error" role="alert" aria-live="polite"></div>

          <button class="login-btn" id="submit" type="submit">Sign in</button>

          <button type="button" class="login-request" id="requestBtn">Request access</button>

          <p class="login-hint">Secured access &mdash; IT Infrastructure &amp; Security</p>
        </form>
      </div>

      <p class="login-footer">
        AKIJ Resource<br />
        <span>&copy; 2026 AKIJ Resource. All Rights Reserved.</span>
      </p>
    </div>

    <!-- Request access dialog -->
    <div class="dialog-overlay" id="reqOverlay" style="display:none">
      <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="reqTitle">
        <div class="dialog-head">
          <h3 id="reqTitle">Request access</h3>
          <p>Ask for a Network Operation Center account. An admin will review and approve your request.</p>
        </div>

        <form id="request-form" novalidate>
          <div class="login-field">
            <label class="login-label" for="rqName">Full name</label>
            <input id="rqName" class="login-input" type="text" placeholder="Md. Munna Islam"
                   autocomplete="name" />
          </div>

          <div class="login-field">
            <label class="login-label" for="rqEmail">Email</label>
            <input id="rqEmail" class="login-input" type="email" placeholder="you@company.com"
                   autocomplete="email" autocapitalize="none" spellcheck="false" />
          </div>

          <div class="login-field">
            <label class="login-label" for="rqPassword">Password</label>
            <input id="rqPassword" class="login-input" type="password" placeholder="Choose a password"
                   autocomplete="new-password" />
          </div>

          <div class="login-field">
            <label class="login-label" for="rqNote">Why do you need access?</label>
            <textarea id="rqNote" class="login-input" rows="3" placeholder="e.g. Department, role, or reason for access"></textarea>
          </div>

          <p class="login-error" id="rqError" role="alert" aria-live="polite"></p>

          <div class="dialog-actions">
            <button type="button" class="login-btn ghost" id="rqCancel">Cancel</button>
            <button type="submit" class="login-btn" id="rqSubmit">Send request</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
