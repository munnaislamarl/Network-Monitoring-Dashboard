name: Monitor & Deploy

# Runs every 5 minutes, polls the devices from GitHub's servers,
# then publishes the snapshot + static dashboard to GitHub Pages.
#
# All configuration lives in the Google Sheet (Devices / Users / Cams tabs),
# read via SHEETS_API_URL + SHEETS_TOKEN. No config files are needed.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

# One monitor run at a time
concurrency:
  group: monitor-pages
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Poll devices and write snapshot
        env:
          SNMP_COMMUNITY: ${{ secrets.SNMP_COMMUNITY }}
          SHEETS_API_URL: ${{ secrets.SHEETS_API_URL }}
          SHEETS_TOKEN: ${{ secrets.SHEETS_TOKEN }}
          PORT: "8080"
        run: |
          node dashboard.js > server.log 2>&1 &
          node tools/dump-data.mjs site/data.json
          echo "----- server.log (tail) -----"
          tail -n 20 server.log || true

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4