services:
  dashboard:
    build: .
    image: noc-dashboard
    container_name: noc-dashboard
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      # Change this to your SNMP community string:
      SNMP_COMMUNITY: "arlzabbix"
    volumes:
      # config + data persist on the host (edit these files, then restart)
      - ./auth.json:/app/auth.json
      - ./routers.json:/app/routers.json
      - ./camera-meta.json:/app/camera-meta.json
      - ./history:/app/history
