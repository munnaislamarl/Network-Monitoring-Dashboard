<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NVR - AKIJ Resource</title>
<link rel="icon" href="/assets/akij-essential-logo.jpg" type="image/jpeg">
<style>
  :root { --bg:#0f1420; --card:#1a2233; --line:#2a3547; --txt:#e6edf7; --mut:#8fa1bd; --ok:#2ecc71; --off:#e74c3c; --acc:#4a8fe0; --warn:#f39c12; --ubi:#00a3e0; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt); font-family:'Segoe UI',Arial,sans-serif; padding:20px; }
  a { color:var(--acc); text-decoration:none; }

  /* top header */
  .appbar { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 16px; margin-bottom:18px; display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .brandlogo { height:40px; width:auto; display:block; border-radius:8px; }
  .live { display:inline-flex; align-items:center; gap:7px; color:var(--ok); font-size:13px; font-weight:600; padding:6px 13px; border:1px solid var(--line); border-radius:20px; background:var(--bg); }
  .livedot { width:8px; height:8px; border-radius:50%; background:var(--ok); box-shadow:0 0 6px var(--ok); animation:pulse 1.6s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
  .spacer { flex:1; }
  .morewrap { position:relative; }
  .chip { background:var(--bg); border:1px solid var(--line); padding:6px 13px; border-radius:20px; font-size:13px; color:var(--mut); cursor:pointer; }
  .chip:hover { border-color:var(--acc); }
  .moremenu { display:none; position:absolute; right:0; top:calc(100% + 8px); background:var(--card); border:1px solid var(--line); border-radius:10px; padding:6px; min-width:170px; z-index:30; box-shadow:0 12px 30px rgba(0,0,0,.4); }
  .moremenu.show { display:block; }
  .moremenu button { display:block; width:100%; text-align:left; background:transparent; border:none; color:var(--txt); padding:9px 12px; border-radius:6px; font-size:13px; cursor:pointer; }
  .moremenu button:hover { background:rgba(74,143,224,.14); }
  .user { display:flex; align-items:center; gap:10px; cursor:pointer; padding:3px 8px; border-radius:10px; border-left:1px solid var(--line); padding-left:14px; }
  .user:hover { background:rgba(74,143,224,.1); }
  .uavatar { width:34px; height:34px; border-radius:50%; background:var(--acc); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; }
  .uinfo { line-height:1.2; }
  .uname { font-size:13px; font-weight:600; }
  .urole { font-size:11px; color:var(--mut); }
  .profilemenu { display:none; position:absolute; right:0; top:calc(100% + 8px); background:var(--card); border:1px solid var(--line); border-radius:10px; padding:6px; min-width:150px; z-index:30; box-shadow:0 12px 30px rgba(0,0,0,.4); }
  .profilemenu.show { display:block; }
  .profilemenu button { display:block; width:100%; text-align:left; background:transparent; border:none; color:var(--txt); padding:9px 12px; border-radius:6px; font-size:13px; cursor:pointer; }
  .profilemenu button:hover { background:rgba(74,143,224,.14); }

  /* NVR info header */
  .nvrhead { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 20px; margin-bottom:18px; }
  .nvrhead-top { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .back { color:var(--acc); font-weight:600; font-size:14px; }
  .back:hover { text-decoration:underline; }
  .nvr-title { font-size:20px; font-weight:700; }
  .nvr-status { margin-left:auto; font-size:12px; font-weight:700; padding:5px 12px; border-radius:6px; }
  .nvr-status.on { background:rgba(46,204,113,.15); color:var(--ok); }
  .nvr-status.off { background:rgba(231,76,60,.15); color:var(--off); }
  .infogrid { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px; margin-top:16px; padding-top:16px; border-top:1px solid var(--line); }
  .infogrid .item .lbl { font-size:11px; color:var(--mut); text-transform:uppercase; letter-spacing:.4px; }
  .infogrid .item .val { font-size:14px; margin-top:4px; font-family:Consolas,monospace; word-break:break-all; }
  .val.green { color:var(--ok); }
  .val.red { color:var(--off); }
  .val.amber { color:var(--warn); }

  /* resource gauges + HDD in one row */
  .monrow { display:flex; gap:14px; flex-wrap:wrap; align-items:stretch; margin-bottom:22px; }
  .hddblock { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; flex:2; min-width:260px; }
  .hddblock .rlbl { font-size:12px; color:var(--mut); text-transform:uppercase; letter-spacing:.5px; }
  .hddsummary { color:var(--txt); font-weight:600; margin-left:6px; }
  .hddgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:10px; margin-top:14px; }
  .hdd { background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:11px 12px; }
  .hdd .hname { font-weight:600; font-size:13px; }
  .hdd .hcap { font-size:11px; color:var(--mut); margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .hdd .hst { display:inline-block; font-size:10px; font-weight:700; padding:2px 7px; border-radius:10px; margin-top:7px; }
  .hdd.connected { border-color:rgba(46,204,113,.4); }
  .hdd .hst.healthy { background:rgba(46,204,113,.15); color:var(--ok); }
  .hdd .hst.warning { background:rgba(243,156,18,.15); color:var(--warn); }
  .hdd .hst.empty { background:rgba(143,161,189,.15); color:var(--mut); }
  .gauges { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; display:flex; gap:40px; flex:1; min-width:220px; justify-content:center; align-items:center; flex-wrap:wrap; }
  .gauge { text-align:center; }
  .ring { --p:0; --c:var(--acc); width:76px; height:76px; border-radius:50%;
    background: conic-gradient(var(--c) calc(var(--p)*1%), var(--bg) 0);
    display:flex; align-items:center; justify-content:center; position:relative; margin:0 auto; }
  .ring::before { content:''; position:absolute; inset:9px; background:var(--card); border-radius:50%; }
  .ring span { position:relative; font-size:15px; font-weight:700; }
  .glabel { font-size:11px; color:var(--mut); text-transform:uppercase; letter-spacing:.4px; margin-top:8px; }
  .gsub { font-size:10px; color:var(--mut); margin-top:2px; }

  /* HDD */
  .section-title { font-size:15px; font-weight:600; color:var(--acc); margin:0 0 12px; }

  /* camera section */
  .camwrap { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:18px 20px; }
  .camnav { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
  .navbtn { background:var(--bg); border:1px solid var(--line); color:var(--mut); padding:7px 13px; border-radius:8px; font-size:12px; cursor:pointer; }
  .navbtn:hover { border-color:var(--acc); color:var(--txt); }
  .navbtn.active { background:var(--acc); color:#fff; border-color:var(--acc); }
  .camtools { display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
  .camsearch { flex:1; min-width:180px; }
  .camsearch input { width:100%; background:var(--bg); border:1px solid var(--line); color:var(--txt); padding:9px 13px; border-radius:8px; font-size:13px; outline:none; }
  .camsearch input:focus { border-color:var(--acc); }
  .camsearch select { width:100%; background:var(--bg); border:1px solid var(--line); color:var(--txt); padding:9px 13px; border-radius:8px; font-size:13px; outline:none; }
  .camcount { font-size:13px; color:var(--mut); white-space:nowrap; }
  .camgrid { display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); gap:12px; }
  @media(max-width:1400px){ .camgrid{grid-template-columns:repeat(4,minmax(0,1fr));} }
  @media(max-width:1100px){ .camgrid{grid-template-columns:repeat(3,minmax(0,1fr));} }
  @media(max-width:820px){ .camgrid{grid-template-columns:repeat(2,minmax(0,1fr));} }
  @media(max-width:520px){ .camgrid{grid-template-columns:1fr;} }
  .camcard { background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:10px; transition:border-color .15s; }
  .camcard:hover { border-color:var(--acc); }
  .camcard.off { opacity:.72; }
  .camcard-head { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .camch { flex:none; font-size:11px; font-weight:700; color:var(--acc); background:rgba(74,143,224,.14); padding:3px 8px; border-radius:8px; }
  .camname { flex:1; min-width:0; font-size:13px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .camdot { flex:none; width:10px; height:10px; border-radius:50%; }
  .camdot.on { background:var(--ok); box-shadow:0 0 6px var(--ok); }
  .camdot.off { background:var(--off); box-shadow:0 0 6px var(--off); }

  /* 16:9 live-video preview */
  .campreview { position:relative; width:100%; aspect-ratio:16/9; border-radius:8px; overflow:hidden; background:#000; }
  .campreview-video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; background:#000; }
  .campreview-overlay { position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(180deg, rgba(0,0,0,.30) 0%, rgba(0,0,0,.04) 42%, rgba(0,0,0,.58) 100%); }
  .campreview-mock { position:absolute; inset:0; overflow:hidden;
    background:linear-gradient(180deg, #0b1322 0%, #0a0f1a 55%, #070b14 100%); }
  .campreview-mock::before { content:''; position:absolute; left:-12%; right:-12%; top:46%; bottom:-14%;
    background:
      repeating-linear-gradient(90deg, rgba(120,150,200,.12) 0 1px, transparent 1px 26px),
      repeating-linear-gradient(0deg, rgba(120,150,200,.12) 0 1px, transparent 1px 22px);
    transform:perspective(150px) rotateX(48deg); transform-origin:top center; opacity:.55; }
  .campreview-mock .mock-scan { position:absolute; left:0; right:0; height:26%; top:-30%;
    background:linear-gradient(180deg, rgba(148,163,184,0) 0%, rgba(148,163,184,.10) 50%, rgba(148,163,184,0) 100%);
    animation:camscan 4.6s linear infinite; }
  .campreview-mock .mock-noise { position:absolute; inset:0; opacity:.16; mix-blend-mode:screen;
    background-image:radial-gradient(rgba(255,255,255,.5) .5px, transparent .6px); background-size:3px 3px;
    animation:camnoise .6s steps(4) infinite; }
  .campreview-mock .mock-nosignal { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:700; letter-spacing:.28em; color:var(--off); }
  @keyframes camscan { 0%{top:-30%} 100%{top:110%} }
  @keyframes camnoise { 0%{background-position:0 0} 25%{background-position:1px 2px} 50%{background-position:2px 1px} 75%{background-position:1px 0} 100%{background-position:0 2px} }

  .campreview-status { position:absolute; left:8px; right:8px; bottom:6px; display:flex; align-items:center; justify-content:space-between; pointer-events:none; }
  .camlive { display:inline-flex; align-items:center; gap:5px; font-size:10px; font-weight:700; letter-spacing:.08em; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.85); }
  .camlive .dot { width:7px; height:7px; border-radius:50%; background:var(--ok); box-shadow:0 0 6px var(--ok); animation:pulse 1.6s infinite; }
  .camrecind { display:inline-flex; align-items:center; gap:5px; font-size:10px; font-weight:700; letter-spacing:.08em; color:var(--off); text-shadow:0 1px 2px rgba(0,0,0,.85); }
  .camrecind .dot { width:7px; height:7px; border-radius:50%; background:var(--off); box-shadow:0 0 6px var(--off); animation:pulse 1.6s infinite; }
  .camoffline-tag { position:absolute; left:8px; top:8px; font-size:9px; font-weight:700; letter-spacing:.14em; color:var(--off); background:rgba(0,0,0,.5); padding:2px 6px; border-radius:6px; }

  .camip { font-size:11px; color:var(--mut); margin-top:8px; font-family:Consolas,monospace; }
  .camtags { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .camtag { font-size:9px; font-weight:700; letter-spacing:.06em; padding:3px 8px; border-radius:20px; }
  .camtag.rec { background:rgba(46,204,113,.15); color:var(--ok); }
  .camtag.rec.idle { background:rgba(143,161,189,.15); color:var(--mut); }
  .camtag.on { background:rgba(74,143,224,.15); color:var(--acc); }
  .camtag.off { background:rgba(231,76,60,.15); color:var(--off); }

  /* ---- view modes: Group / Frame ---- */
  .viewpanel { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:14px; }
  .vbtn { background:var(--bg); border:1px solid var(--line); color:var(--mut); padding:7px 13px; border-radius:8px; font-size:12px; cursor:pointer; }
  .vbtn:hover { border-color:var(--acc); color:var(--txt); }
  .vbtn.active { background:var(--acc); color:#fff; border-color:var(--acc); }
  .vbtn.danger { color:var(--off); }
  .vbtn.danger:hover { border-color:var(--off); color:var(--off); }
  .groupsec { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:14px; }
  .groupsec-head { display:flex; align-items:center; gap:10px; margin-bottom:12px; flex-wrap:wrap; }
  .groupsec-head h3 { font-size:14px; font-weight:700; color:var(--acc); }
  .groupsec-head .gcount { font-size:12px; color:var(--mut); }
  .groupsec-head .gacts { margin-left:auto; display:flex; gap:6px; }
  .tilegrid, .framegrid { display:grid; gap:12px; }
  .livetile { background:var(--bg); border:1px solid var(--line); border-radius:10px; padding:8px; }
  .livetile.off { opacity:.75; }
  .livetile-top { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .livetile-top .camch { flex:none; }
  .livetile-top .camname { flex:1; }
  .frame { position:relative; background:var(--bg); border:1px dashed var(--line); border-radius:10px; padding:8px; }
  .frame.filled { border-style:solid; }
  .frame-pick { width:100%; margin-top:8px; background:var(--bg); border:1px solid var(--line); color:var(--txt); padding:6px 8px; border-radius:6px; font-size:11px; outline:none; }
  .frame-pick:focus { border-color:var(--acc); }

  /* ---- modal ---- */
  .modal-bg { position:fixed; inset:0; background:rgba(0,0,0,.62); display:none; align-items:center; justify-content:center; z-index:50; }
  .modal-bg.show { display:flex; }
  .modal { background:var(--card); border:1px solid var(--line); border-radius:14px; width:min(560px,92vw); max-height:86vh; display:flex; flex-direction:column; box-shadow:0 20px 50px rgba(0,0,0,.5); }
  .modal-head { padding:14px 16px; border-bottom:1px solid var(--line); font-weight:700; font-size:15px; }
  .modal-body { padding:14px 16px; overflow:auto; }
  .modal-foot { padding:12px 16px; border-top:1px solid var(--line); display:flex; gap:8px; justify-content:flex-end; }
  .modal-body input[type=text] { width:100%; background:var(--bg); border:1px solid var(--line); color:var(--txt); padding:9px 12px; border-radius:8px; margin-bottom:12px; outline:none; }
  .modal-body input[type=text]:focus { border-color:var(--acc); }
  .camchecks { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:6px; }
  .camcheck { display:flex; align-items:center; gap:8px; padding:6px 8px; border:1px solid var(--line); border-radius:8px; font-size:12px; cursor:pointer; }
  .camcheck:hover { border-color:var(--acc); }
  .camcheck input { accent-color:var(--acc); }
  .camcheck span { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* actions */
  .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:18px; }
  .actbtn { background:var(--card); border:1px solid var(--line); color:var(--txt); padding:9px 16px; border-radius:8px; font-size:13px; cursor:pointer; }
  .actbtn:hover { border-color:var(--acc); color:var(--acc); }
  .foot { margin-top:18px; color:var(--mut); font-size:12px; text-align:center; }
</style>
</head>
<body>
<header class="appbar">
  <a href="/" title="Home"><img src="/assets/akij-essential-logo.jpg" alt="Akij Essential" class="brandlogo"></a>
  <span class="live"><span class="livedot"></span>Live</span>
  <div class="spacer"></div>
  <div class="morewrap">
    <button class="chip" onclick="toggleMenu(event,'moreMenu')">More ▾</button>
    <div class="moremenu" id="moreMenu">
      <button onclick="location.href='/'">Dashboard</button>
      <button onclick="refreshNvr()">Refresh</button>
      <button onclick="doLogout()">🔓 Sign out</button>
    </div>
  </div>
  <div class="user" id="userBox" onclick="toggleMenu(event,'profileMenu')">
    <div class="uavatar" id="uAvatar">?</div>
    <div class="uinfo"><div class="uname" id="uName">--</div><div class="urole" id="uRole">admin</div></div>
    <div class="profilemenu" id="profileMenu">
      <button onclick="doLogout()">🔓 Sign out</button>
    </div>
  </div>
</header>

<div class="nvrhead">
  <div class="nvrhead-top">
    <a class="back" href="/">&larr; Back to Dashboard</a>
    <div class="nvr-title" id="nvrName">Loading...</div>
    <div class="nvr-status" id="nvrStatus">--</div>
  </div>
  <div class="infogrid" id="infoGrid"></div>
</div>

<div class="monrow">
  <div class="hddblock">
    <div class="rlbl">HDD / Storage <span class="hddsummary" id="hddSummary">--</span></div>
    <div class="hddgrid" id="hddList"></div>
  </div>
  <div class="gauges">
    <div class="gauge"><div class="ring" id="cpuRing"><span id="cpuVal">--</span></div><div class="glabel">CPU Usage</div><div class="gsub" id="cpuSub">--</div></div>
    <div class="gauge"><div class="ring" id="ramRing"><span id="ramVal">--</span></div><div class="glabel">RAM Usage</div><div class="gsub" id="ramSub">--</div></div>
    <div class="gauge"><div class="ring" id="storRing"><span id="storVal">--</span></div><div class="glabel">Storage Usage</div><div class="gsub" id="storSub">--</div></div>
  </div>
</div>

<div class="camwrap">
  <div class="camnav" id="camNav">
    <button class="navbtn active" data-f="all" onclick="setFilter('all')">All</button>
    <button class="navbtn" data-f="online" onclick="setFilter('online')">Online</button>
    <button class="navbtn" data-f="offline" onclick="setFilter('offline')">Offline</button>
    <button class="navbtn" data-f="recissue" onclick="setFilter('recissue')">Recording Issues</button>
    <button class="navbtn" data-v="group" onclick="setView('group')">Group View</button>
    <button class="navbtn" data-v="frame" onclick="setView('frame')">Frame View</button>
    <button class="navbtn" onclick="void(0)">Playback</button>
    <button class="navbtn" onclick="void(0)">Logs</button>
    <button class="navbtn" onclick="void(0)">Intelligence &amp; Compliance</button>
    <button class="navbtn" onclick="void(0)">Settings</button>
  </div>
  <div class="camtools">
    <div class="camsearch"><input id="camSearch" type="text" placeholder="Search camera by name or IP..." oninput="renderCams()"></div>
    <div class="camsearch" style="max-width:180px"><select id="camSort" onchange="renderCams()">
      <option value="ch">Sort by Channel</option>
      <option value="name">Sort by Name</option>
      <option value="status">Sort by Status</option>
    </select></div>
    <div class="camcount" id="camCount">0 / 0 cameras</div>
  </div>
  <div class="viewpanel" id="viewPanel"></div>
  <div class="camgrid" id="camGrid"></div>
</div>

<div class="actions">
  <button class="actbtn" onclick="refreshNvr()">↻ Refresh</button>
  <button class="actbtn" onclick="void(0)">▶ Playback</button>
  <button class="actbtn" onclick="void(0)">📋 Logs</button>
  <button class="actbtn" onclick="void(0)">🎥 Camera Management</button>
  <button class="actbtn" onclick="void(0)">⚙ NVR Settings</button>
</div>

<div class="foot">NVR Detail View &middot; Auto-refresh every 10s &middot; AKIJ Resource</div>

<div class="modal-bg" id="nvrModal">
  <div class="modal">
    <div class="modal-head" id="nvrModalTitle">Title</div>
    <div class="modal-body" id="nvrModalBody"></div>
    <div class="modal-foot" id="nvrModalFoot"></div>
  </div>
</div>

<script>
const q = new URLSearchParams(location.search);
const id = q.get('id');
const esc = s => String(s == null ? '--' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let nvrData = null;
let camFilter = 'all';

function fmtSize(mb){ if(mb==null||isNaN(mb)||mb<=0) return '--'; if(mb>=1048576) return (mb/1048576).toFixed(2)+' TB'; if(mb>=1024) return (mb/1024).toFixed(1)+' GB'; return mb.toFixed(0)+' MB'; }
function fmtUptime(s){ if(!s) return '--'; s=Math.floor(s); const d=Math.floor(s/86400); s-=d*86400; const h=Math.floor(s/3600); s-=h*3600; const m=Math.floor(s/60); if(d>0) return d+'d '+h+'h'; if(h>0) return h+'h '+m+'m'; return m+'m'; }
function fmtAgo(ms){ const s=Math.max(0,Math.floor((Date.now()-ms)/1000)); return s<60?s+'s ago':Math.floor(s/60)+'m ago'; }

function toggleMenu(e, id){
  if(e) e.stopPropagation();
  const el = document.getElementById(id);
  el.classList.toggle('show');
}
document.addEventListener('click', ()=>{ ['moreMenu','profileMenu'].forEach(id=>{const m=document.getElementById(id); if(m) m.classList.remove('show');}); });
async function doLogout(){ try{ await fetch('/api/logout',{method:'POST'}); }catch(e){} location.href='/login'; }

async function loadMe(){
  try { const d = await (await fetch('/api/me')).json();
    const name = d.displayName || d.username || 'User';
    document.getElementById('uName').textContent = name;
    document.getElementById('uRole').textContent = d.role || 'admin';
    document.getElementById('uAvatar').textContent = name.charAt(0).toUpperCase();
  } catch(e){}
}

async function loadNvr(){
  try {
    const res = await fetch('/api/nvr?id=' + encodeURIComponent(id));
    if (res.status === 401) { location.href='/login'; return; }
    nvrData = await res.json();
    renderHeader();
    renderResources();
    renderHdd();
    renderCams();
  } catch(e){ console.error(e); }
}
function renderHeader(){
  const d = nvrData;
  document.getElementById('nvrName').textContent = d.name;
  const st = document.getElementById('nvrStatus');
  st.textContent = d.online ? 'ONLINE' : 'OFFLINE';
  st.className = 'nvr-status ' + (d.online?'on':'off');
  const alerts = (d.offlineCount||0) + 0;
  const health = d.online ? 'Healthy' : 'Offline';
  document.getElementById('infoGrid').innerHTML =
    `<div class="item"><div class="lbl">Model</div><div class="val">${esc(d.model)}</div></div>
     <div class="item"><div class="lbl">Brand</div><div class="val">${esc(d.brand)}</div></div>
     <div class="item"><div class="lbl">IP Address</div><div class="val">${esc(d.ip)}:${esc(d.port)}</div></div>
     <div class="item"><div class="lbl">Status</div><div class="val ${d.online?'green':'red'}">${d.online?'Online':'Offline'}</div></div>
     <div class="item"><div class="lbl">Alerts</div><div class="val ${alerts>0?'amber':'green'}">${alerts}</div></div>
     <div class="item"><div class="lbl">Uptime</div><div class="val">${fmtUptime(d.uptimeSeconds)}</div></div>
     <div class="item"><div class="lbl">Backup</div><div class="val">--</div></div>
     <div class="item"><div class="lbl">Firmware</div><div class="val">${esc(d.firmwareVersion)}</div></div>
     <div class="item"><div class="lbl">Last Updated</div><div class="val">${fmtAgo(d.updated)}</div></div>
     <div class="item"><div class="lbl">Health</div><div class="val ${d.online?'green':'red'}">${health}</div></div>`;
}
function ringColor(p){ return p==null ? '#3a4357' : p>=90 ? 'var(--off)' : p>=70 ? 'var(--warn)' : 'var(--ok)'; }
function setRing(el, p, sub){
  el.style.setProperty('--p', p==null ? 0 : p);
  el.style.setProperty('--c', ringColor(p));
}
function renderResources(){
  const d = nvrData;
  // CPU
  const cpu = d.cpuUsage;
  document.getElementById('cpuVal').textContent = cpu==null ? 'N/A' : cpu+'%';
  document.getElementById('cpuSub').textContent = '--';
  setRing(document.getElementById('cpuRing'), cpu);
  // RAM
  const rp = d.ram && d.ram.percent;
  document.getElementById('ramVal').textContent = rp==null ? '--' : rp+'%';
  document.getElementById('ramSub').textContent = (d.ram&&d.ram.usedMB!=null)? fmtSize(d.ram.usedMB)+' / '+fmtSize(d.ram.totalMB) : '--';
  setRing(document.getElementById('ramRing'), rp);
  // Storage
  const sp = d.storage && d.storage.percent;
  document.getElementById('storVal').textContent = sp==null ? '--' : sp+'%';
  document.getElementById('storSub').textContent = (d.storage&&d.storage.totalMB)? fmtSize(d.storage.totalMB-d.storage.freeMB)+' / '+fmtSize(d.storage.totalMB) : '--';
  setRing(document.getElementById('storRing'), sp);
}
function renderHdd(){
  const d = nvrData;
  const list = d.hdds || [];
  const total = d.totalSlots || (list.length ? Math.max.apply(null, list.map(h=>h.id)) : 0);
  if(!total){ document.getElementById('hddList').innerHTML = '<div style="color:var(--mut);font-size:13px">No storage data available.</div>'; document.getElementById('hddSummary').textContent=''; return; }
  const byId = {};
  list.forEach(h => byId[h.id] = h);
  const connected = d.connectedSlots != null ? d.connectedSlots : list.filter(h=>h.status==='healthy').length;
  document.getElementById('hddSummary').textContent = connected + ' / ' + total + ' connected';
  let html = '';
  for (let i = 1; i <= total; i++){
    const h = byId[i];
    if (h && h.status === 'healthy' && h.capacityMB > 0){
      html += `<div class="hdd connected"><div class="hname">HDD${i}</div>
        <div class="hcap">${esc(h.model)||'--'}</div>
        <div class="hcap">${fmtSize(h.capacityMB)}</div>
        <span class="hst healthy">Connected</span></div>`;
    } else {
      html += `<div class="hdd"><div class="hname">HDD${i}</div>
        <div class="hcap">${h && h.status==='warning' ? 'Warning' : 'No disk'}</div>
        <span class="hst ${h && h.status==='warning'?'warning':'empty'}">${h && h.status==='warning'?'Warning':'Empty'}</span></div>`;
    }
  }
  document.getElementById('hddList').innerHTML = html;
}
// Reusable camera preview renderer.
// If the camera has a browser-playable source (HLS .m3u8 / MP4 / WebM), it is
// played in an HTML5 <video>. Otherwise a lightweight animated CCTV placeholder
// is shown. `c.source` is the per-camera field intended for real RTSP/HLS/WebRTC
// streams once a server-side transcriber is wired up.
function isPlayableSource(src){
  if(!src) return false;
  return /^https?:\/\//i.test(src) || /\.(m3u8|mp4|webm|ogg)(\?|#|$)/i.test(src);
}
function camPreview(c, on){
  const src = c.source || '';
  if(isPlayableSource(src)){
    return '<video class="campreview-video" src="'+esc(src)+'" autoplay muted loop playsinline preload="metadata"></video>';
  }
  return '<div class="campreview-mock'+(on?'':' off')+'">'+
    '<span class="mock-scan"></span><span class="mock-noise"></span>'+
    (on?'':'<div class="mock-nosignal">NO SIGNAL</div>')+
    '</div>';
}
// ---------- view modes: All grid / Group / Frame ----------
let camView = 'grid';
let camGroups = [];       // [{ id, name, cams:[channelId,...] }]
let frameCount = 4;
let frameSlots = [];      // [channelId|null, ...]

function viewKey(kind){ return 'nvr.'+kind+'.'+(id||'x'); }
function loadViewState(){
  try { camGroups = JSON.parse(localStorage.getItem(viewKey('groups'))||'[]') || []; } catch(e){ camGroups = []; }
  try { frameCount = parseInt(localStorage.getItem(viewKey('frameCount'))||'4',10) || 4; } catch(e){ frameCount = 4; }
  try { frameSlots = JSON.parse(localStorage.getItem(viewKey('frames'))||'[]') || []; } catch(e){ frameSlots = []; }
  if(!Array.isArray(camGroups)) camGroups = [];
  if(!Array.isArray(frameSlots)) frameSlots = [];
}
function saveGroups(){ try { localStorage.setItem(viewKey('groups'), JSON.stringify(camGroups)); } catch(e){} }
function saveFrames(){ try { localStorage.setItem(viewKey('frames'), JSON.stringify(frameSlots)); localStorage.setItem(viewKey('frameCount'), String(frameCount)); } catch(e){} }

function camList(){ return ((nvrData && nvrData.cameras) || []).filter(c => !c.hidden); }
function camById(chId){ return camList().find(c => c.id === chId) || null; }
function searchSort(list){
  const q2 = (document.getElementById('camSearch').value||'').toLowerCase();
  if(q2) list = list.filter(c => (c.name+' '+c.ip).toLowerCase().indexOf(q2) >= 0);
  const sort = document.getElementById('camSort').value;
  if(sort==='name') return list.slice().sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  if(sort==='status') return list.slice().sort((a,b)=>(a.online===true?0:1)-(b.online===true?0:1));
  return list.slice().sort((a,b)=>a.id-b.id);
}

function updateNav(){
  document.querySelectorAll('#camNav .navbtn[data-f]').forEach(b => b.classList.toggle('active', camView==='grid' && b.dataset.f===camFilter));
  document.querySelectorAll('#camNav .navbtn[data-v]').forEach(b => b.classList.toggle('active', b.dataset.v===camView));
}
function setFilter(f){ camFilter = f; camView = 'grid'; updateNav(); renderCams(); }
function setView(v){ camView = (camView===v ? 'grid' : v); updateNav(); renderCams(); }

function liveTile(c){
  const on = c && c.online===true;
  const rec = on ? (c.recording!==false) : false;
  return '<div class="livetile'+(on?'':' off')+'">'+
    '<div class="livetile-top"><span class="camch">CH'+esc(c.id)+'</span>'+
      '<span class="camname" title="'+esc(c.name)+'">'+esc(c.name)+'</span>'+
      '<span class="camdot '+(on?'on':'off')+'"></span></div>'+
    '<div class="campreview">'+camPreview(c,on)+
      '<div class="campreview-overlay"></div>'+
      (on?'':'<span class="camoffline-tag">OFFLINE</span>')+
      '<div class="campreview-status">'+
        (on?'<span class="camlive"><span class="dot"></span>LIVE</span>':'<span class="camlive" style="color:var(--off)"><span class="dot" style="background:var(--off)"></span>OFFLINE</span>')+
        (rec?'<span class="camrecind"><span class="dot"></span>REC</span>':'')+
      '</div>'+
    '</div>'+
    '<div class="camip">'+esc(c.ip)+'</div>'+
  '</div>';
}

// ---- Group View ----
function renderGroupView(){
  document.getElementById('viewPanel').innerHTML =
    '<button class="vbtn" onclick="openGroupEditor()">+ New Group</button>'+
    '<span style="font-size:12px;color:var(--mut)">Nijer moto group banao — prottek group er camera live view dekhabe</span>';
  const grid = document.getElementById('camGrid');
  grid.className = '';
  if(!camGroups.length){
    grid.innerHTML = '<div style="color:var(--mut);font-size:13px">Kono group nei. “+ New Group” click koro.</div>';
    document.getElementById('camCount').textContent = '0 groups';
    return;
  }
  grid.innerHTML = camGroups.map(g => {
    const cams = searchSort((g.cams||[]).map(camById).filter(Boolean));
    return '<div class="groupsec">'+
      '<div class="groupsec-head"><h3>'+esc(g.name)+'</h3><span class="gcount">'+((g.cams||[]).length)+' cams</span>'+
        '<div class="gacts"><button class="vbtn" onclick="openGroupEditor(\''+g.id+'\')">Edit</button>'+
        '<button class="vbtn danger" onclick="deleteGroup(\''+g.id+'\')">Delete</button></div></div>'+
      (cams.length
        ? '<div class="tilegrid" style="grid-template-columns:repeat(auto-fill,minmax(250px,1fr))">'+cams.map(liveTile).join('')+'</div>'
        : '<div style="color:var(--mut);font-size:12px">No cameras in this group.</div>')+
    '</div>';
  }).join('');
  document.getElementById('camCount').textContent = camGroups.length + ' groups';
}
function openGroupEditor(gid){
  const g = gid ? camGroups.find(x=>x.id===gid) : null;
  const selected = new Set(g ? (g.cams||[]) : []);
  const list = camList().slice().sort((a,b)=>a.id-b.id);
  const body = '<input type="text" id="grpName" placeholder="Group name (e.g. Main Gate)" value="'+esc(g?g.name:'')+'">'+
    '<div class="camchecks">'+list.map(c =>
      '<label class="camcheck"><input type="checkbox" value="'+c.id+'"'+(selected.has(c.id)?' checked':'')+'>'+
      '<span>CH'+esc(c.id)+' · '+esc(c.name)+'</span></label>').join('')+'</div>';
  const foot = '<button class="vbtn" onclick="closeModal()">Cancel</button>'+
    '<button class="vbtn active" onclick="saveGroupEditor(\''+(gid||'')+'\')">Save Group</button>';
  openModal(g ? 'Edit Group' : 'New Group', body, foot);
}
function saveGroupEditor(gid){
  const name = (document.getElementById('grpName').value||'').trim() || 'Group';
  const cams = Array.from(document.querySelectorAll('#nvrModalBody input[type=checkbox]:checked')).map(x=>parseInt(x.value,10));
  if(gid){ const g = camGroups.find(x=>x.id===gid); if(g){ g.name = name; g.cams = cams; } }
  else { camGroups.push({ id:'g'+Date.now(), name:name, cams:cams }); }
  saveGroups(); closeModal(); renderCams();
}
function deleteGroup(gid){
  if(!confirm('Delete this group?')) return;
  camGroups = camGroups.filter(g=>g.id!==gid);
  saveGroups(); renderCams();
}

// ---- Frame View ----
function renderFrameView(){
  document.getElementById('viewPanel').innerHTML =
    '<span style="font-size:12px;color:var(--mut);align-self:center">Frames:</span>'+
    [1,4,6,9,16].map(n => '<button class="vbtn'+(frameCount===n?' active':'')+'" onclick="setFrameCount('+n+')">'+n+'</button>').join('')+
    '<span style="font-size:12px;color:var(--mut);align-self:center">Prottek frame e camera select koro</span>';
  if(frameSlots.length !== frameCount){
    frameSlots = Array.from({ length: frameCount }, (_,i) => frameSlots[i]!=null ? frameSlots[i] : null);
  }
  const cols = frameCount===1 ? 1 : frameCount<=4 ? 2 : frameCount<=9 ? 3 : 4;
  const list = camList().slice().sort((a,b)=>a.id-b.id);
  const opts = cid => '<option value="">— empty —</option>'+list.map(x => '<option value="'+x.id+'"'+(cid===x.id?' selected':'')+'>CH'+esc(x.id)+' · '+esc(x.name)+'</option>').join('');
  const grid = document.getElementById('camGrid');
  grid.className = '';
  grid.innerHTML = '<div class="framegrid" style="grid-template-columns:repeat('+cols+',minmax(0,1fr))">'+
    frameSlots.map((cid,i) => {
      const c = cid!=null ? camById(cid) : null;
      return '<div class="frame'+(c?' filled':'')+'">'+
        (c ? liveTile(c) : '<div style="display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:12px;padding:26px 0">Frame '+(i+1)+'</div>')+
        '<select class="frame-pick" onchange="assignFrame('+i+', this.value)">'+opts(cid)+'</select>'+
      '</div>';
    }).join('')+
  '</div>';
  document.getElementById('camCount').textContent = frameCount + ' frames';
}
function setFrameCount(n){ frameCount = n; if(frameSlots.length>n) frameSlots = frameSlots.slice(0,n); saveFrames(); renderCams(); }
function assignFrame(i, val){ frameSlots[i] = val ? parseInt(val,10) : null; saveFrames(); renderFrameView(); }

// ---- modal helpers ----
function openModal(title, body, foot){
  document.getElementById('nvrModalTitle').textContent = title;
  document.getElementById('nvrModalBody').innerHTML = body;
  document.getElementById('nvrModalFoot').innerHTML = foot;
  document.getElementById('nvrModal').classList.add('show');
}
function closeModal(){ document.getElementById('nvrModal').classList.remove('show'); }

// ---- All (card grid) ----
function renderCardView(){
  document.getElementById('viewPanel').innerHTML = '';
  let list = camList();
  if(camFilter==='online') list = list.filter(c=>c.online===true);
  else if(camFilter==='offline') list = list.filter(c=>c.online===false);
  else if(camFilter==='recissue') list = list.filter(c=>c.online===true && c.recording!==true);
  list = searchSort(list);
  const total = camList().length;
  document.getElementById('camCount').textContent = list.length + ' / ' + total + ' cameras';
  const grid = document.getElementById('camGrid');
  grid.className = 'camgrid';
  grid.innerHTML = list.map(c=>{
    const on = c.online===true;
    const rec = on ? (c.recording!==false) : false;
    return `<div class="camcard ${on?'':'off'}">
      <div class="camcard-head">
        <span class="camch">CH${esc(c.id)}</span>
        <span class="camname" title="${esc(c.name)}">${esc(c.name)}</span>
        <span class="camdot ${on?'on':'off'}"></span>
      </div>
      <div class="campreview">
        ${camPreview(c,on)}
        <div class="campreview-overlay"></div>
        ${on?'':'<span class="camoffline-tag">OFFLINE</span>'}
        <div class="campreview-status">
          ${on?'<span class="camlive"><span class="dot"></span>LIVE</span>':'<span class="camlive" style="color:var(--off)"><span class="dot" style="background:var(--off);box-shadow:0 0 6px var(--off)"></span>OFFLINE</span>'}
          ${rec?'<span class="camrecind"><span class="dot"></span>REC</span>':''}
        </div>
      </div>
      <div class="camip">${esc(c.ip)}</div>
      <div class="camtags">
        <span class="camtag rec ${rec?'':'idle'}">${rec?'RECORDING':'STANDBY'}</span>
        <span class="camtag ${on?'on':'off'}">${on?'ONLINE':'OFFLINE'}</span>
      </div>
    </div>`;
  }).join('') || '<div style="color:var(--mut);grid-column:1/-1;font-size:13px">No cameras match.</div>';
}
function renderCams(){
  if(!nvrData) return;
  updateNav();
  if(camView==='group') renderGroupView();
  else if(camView==='frame') renderFrameView();
  else renderCardView();
}
function refreshNvr(){ nvrData=null; loadNvr(); }
document.getElementById('nvrModal').addEventListener('click', e=>{ if(e.target.id==='nvrModal') closeModal(); });
loadViewState();
loadMe();
loadNvr();
setInterval(loadNvr, 10000);
</script>
</body>
