<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AKIJ Resource</title>
<link rel="icon" href="/assets/akij-essential-logo.jpg" type="image/jpeg">
<style>
  :root { --bg:#0f1420; --card:#1a2233; --line:#2a3547; --txt:#e6edf7; --mut:#8fa1bd; --ok:#2ecc71; --off:#e74c3c; --acc:#4a8fe0; --warn:#f39c12; --ubi:#00a3e0; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt); font-family:'Segoe UI',Arial,sans-serif; padding:20px; }
  header { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:16px; }
  h1 { font-size:22px; font-weight:600; }
  .topbar { display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
  .searchwrap { flex:1; min-width:220px; position:relative; }
  .searchwrap input { width:100%; background:var(--card); border:1px solid var(--line); color:var(--txt); padding:10px 14px 10px 38px; border-radius:8px; font-size:14px; outline:none; }
  .searchwrap input:focus { border-color:var(--acc); }
  .searchwrap .ic { position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--mut); }
  .btn { background:var(--acc); color:#fff; border:none; padding:10px 18px; border-radius:8px; font-size:14px; font-weight:600; cursor:pointer; }
  .btn:hover { filter:brightness(1.1); }
  .stats { display:flex; gap:10px; font-size:13px; color:var(--mut); flex-wrap:wrap; align-items:center; }
  .pill { background:var(--card); border:1px solid var(--line); padding:5px 12px; border-radius:20px; }
  .pill b { color:var(--txt); }
  .pill.filterable { cursor:pointer; user-select:none; transition:border-color .15s, background .15s; }
  .pill.filterable:hover { border-color:var(--acc); }
  .pill.filterable.active { border-color:var(--acc); background:rgba(74,143,224,.15); box-shadow:0 0 0 1px var(--acc) inset; }
  /* ---- app top bar ---- */
  .appbar { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-bottom:18px; position:relative; }
  .abrow1 { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:10px; text-decoration:none; cursor:pointer; }
  .brandlogo { height:46px; width:auto; display:block; border-radius:8px; transition:opacity .15s; }
  .brand:hover .brandlogo { opacity:.85; }
  .blogo { display:inline-flex; align-items:center; justify-content:center; width:32px; height:32px; border-radius:9px; background:linear-gradient(135deg,#5b53d6,#3f3aa8); color:#fff; font-weight:800; }
  .bacc { color:var(--acc); }
  .abrow1 .searchwrap { flex:1; min-width:200px; }
  .addbtn { white-space:nowrap; }
  .user { display:flex; align-items:center; gap:10px; position:relative; cursor:pointer; padding:3px 8px; border-radius:10px; border-left:1px solid var(--line); padding-left:14px; margin-left:4px; }
  .user:hover { background:rgba(74,143,224,.1); }
  .uchevs { color:var(--mut); font-size:12px; }
  .profilemenu { display:none; position:absolute; right:0; top:calc(100% + 8px); background:var(--card); border:1px solid var(--line); border-radius:10px; padding:6px; min-width:160px; z-index:30; box-shadow:0 12px 30px rgba(0,0,0,.4); }
  .profilemenu.show { display:block; }
  .profilemenu button { display:block; width:100%; text-align:left; background:transparent; border:none; color:var(--txt); padding:9px 12px; border-radius:6px; font-size:13px; cursor:pointer; }
  .profilemenu button:hover { background:rgba(74,143,224,.14); }
  .uavatar { width:36px; height:36px; border-radius:50%; background:var(--acc); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:700; }
  .uinfo { line-height:1.2; }
  .uname { font-size:14px; font-weight:600; }
  .urole { font-size:11px; color:var(--mut); }
  .abrow2 { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
  .chips { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .chips.rightend { margin-left:auto; }
  .chip { background:var(--bg); border:1px solid var(--line); padding:6px 13px; border-radius:20px; font-size:13px; color:var(--mut); }
  .chip b { color:var(--txt); }
  .chip.on b { color:var(--ok); }
  .chip.off b { color:var(--off); }
  .chip.alert b { color:var(--warn); }
  .chip.alert { color:var(--warn); }
  .chip.filterable { cursor:pointer; user-select:none; transition:border-color .15s, background .15s; }
  .chip.filterable:hover { border-color:var(--acc); }
  .chip.filterable.active { border-color:var(--acc); background:rgba(74,143,224,.15); box-shadow:0 0 0 1px var(--acc) inset; }
  .chip.live { color:var(--ok); }
  .livedot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--ok); margin-right:6px; box-shadow:0 0 6px var(--ok); animation:pulse 1.6s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }
  .morewrap { position:relative; }
  .chip.more { cursor:pointer; color:var(--txt); }
  .chip.more:hover { border-color:var(--acc); }
  .moremenu { display:none; position:absolute; right:0; top:calc(100% + 8px); background:var(--card); border:1px solid var(--line); border-radius:10px; padding:6px; min-width:170px; z-index:20; box-shadow:0 12px 30px rgba(0,0,0,.4); }
  .moremenu.show { display:block; }
  .moremenu button { display:block; width:100%; text-align:left; background:transparent; border:none; color:var(--txt); padding:9px 12px; border-radius:6px; font-size:13px; cursor:pointer; }
  .moremenu button:hover { background:rgba(74,143,224,.14); }
  @media(max-width:720px){ .abrow1{padding-right:0} .user{position:static; margin-left:auto} .abrow1 .searchwrap{flex-basis:100%; order:3} }
  .cathead { display:flex; align-items:center; justify-content:space-between; gap:10px; margin:24px 0 12px; padding-bottom:8px; border-bottom:2px solid var(--line); }
  .cathead h2 { font-size:17px; font-weight:600; color:var(--acc); }
  .cathead .ccount { font-size:12px; color:var(--mut); }
  .cat { display:grid; grid-template-columns:repeat(5, minmax(0, 1fr)); gap:12px; }
  @media(max-width:1400px){ .cat{grid-template-columns:repeat(4, minmax(0, 1fr));} }
  @media(max-width:1100px){ .cat{grid-template-columns:repeat(3, minmax(0, 1fr));} }
  @media(max-width:820px){ .cat{grid-template-columns:repeat(2, minmax(0, 1fr));} }
  @media(max-width:520px){ .cat{grid-template-columns:1fr;} }
  .devcard { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; cursor:pointer; transition:border-color .15s; }
  .devcard:hover { border-color:var(--acc); }
  .devcard.off { opacity:.78; }
  .devhead { padding:12px 14px; display:flex; align-items:center; gap:12px; }
  .stDot { width:12px; height:12px; border-radius:50%; flex:0 0 auto; }
  .stDot.on { background:var(--ok); box-shadow:0 0 8px var(--ok); }
  .stDot.off { background:var(--off); box-shadow:0 0 8px var(--off); }
  .devinfo { flex:1; min-width:0; }
  .devname { font-weight:600; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .devsub { font-size:11px; color:var(--mut); margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .devstat { font-size:11px; font-weight:700; padding:4px 10px; border-radius:6px; flex:0 0 auto; }
  .devstat.on { background:rgba(46,204,113,.15); color:var(--ok); }
  .devstat.off { background:rgba(231,76,60,.15); color:var(--off); }
  .chint { color:var(--mut); font-size:16px; flex:0 0 auto; transition:transform .2s; }
  .devcard.open .chint { transform:rotate(90deg); }
  .details { display:none; border-top:1px solid var(--line); padding:12px 14px; }
  .devcard.open .details { display:block; }
  .meta { display:grid; grid-template-columns:1fr 1fr; gap:8px 12px; padding-bottom:10px; margin-bottom:10px; border-bottom:1px solid var(--line); font-size:12px; }
  .meta .lbl { color:var(--mut); }
  .meta .val { color:var(--txt); font-family:Consolas,monospace; }
  .delbtn { grid-column:1/-1; background:rgba(231,76,60,.12); color:var(--off); border:1px solid var(--off); padding:5px 10px; border-radius:6px; font-size:11px; cursor:pointer; margin-top:6px; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th,td { text-align:left; padding:6px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--mut); font-weight:600; }
  tr:last-child td { border-bottom:none; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
  .dot.up { background:var(--ok); }
  .dot.down { background:var(--off); }
  .off-msg { color:var(--off); font-size:13px; }
  .scroll { max-height:360px; overflow-y:auto; border:1px solid var(--line); border-radius:8px; }
  .foot { margin-top:18px; color:var(--mut); font-size:12px; text-align:center; }
  .upd { color:var(--acc); }
  .logout-btn { background:transparent; border:1px solid var(--line); color:var(--mut); padding:5px 12px; border-radius:20px; font-size:12px; cursor:pointer; }
  .logout-btn:hover { color:var(--off); border-color:var(--off); }
  .vtag { display:inline-block; font-size:10px; font-weight:700; padding:2px 7px; border-radius:10px; margin-left:6px; vertical-align:middle; }
  .vtag.mt { background:rgba(74,143,224,.15); color:var(--acc); }
  .vtag.ub { background:rgba(0,163,224,.15); color:var(--ubi); }
  .vtag.cb { background:rgba(242,156,23,.15); color:var(--warn); }
  /* modal */
  .ov { display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:50; align-items:center; justify-content:center; padding:20px; }
  .ov.show { display:flex; }
  .modal { background:var(--card); border:1px solid var(--line); border-radius:12px; width:100%; max-width:460px; padding:22px; }
  .modal h3 { margin-bottom:16px; font-size:17px; }
  .cam-modal { max-width:920px; }
  .camscroll { max-height:62vh; overflow:auto; border:1px solid var(--line); border-radius:8px; }
  .camtable table { width:100%; border-collapse:collapse; font-size:12px; }
  .camtable th, .camtable td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); white-space:nowrap; }
  .camtable th { color:var(--mut); font-weight:600; position:sticky; top:0; background:var(--card); }
  .camtable tr:last-child td { border-bottom:none; }
  .camtable .cdot { display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; }
  .camtable .cdot.on { background:var(--ok); }
  .camtable .cdot.off { background:var(--off); }
  .fld { margin-bottom:12px; }
  .fld label { display:block; font-size:12px; color:var(--mut); margin-bottom:5px; }
  .fld input, .fld select { width:100%; background:var(--bg); border:1px solid var(--line); color:var(--txt); padding:9px 11px; border-radius:6px; font-size:13px; outline:none; }
  .fld input:focus, .fld select:focus { border-color:var(--acc); }
  .mbtns { display:flex; gap:10px; margin-top:16px; justify-content:flex-end; }
  .btn.gray { background:var(--line); }
  .msg { margin-top:10px; font-size:12px; }
</style>
</head>
<body>
<header class="appbar">
  <div class="abrow1">
    <a class="brand" href="/" title="Home"><img src="/assets/akij-essential-logo.jpg" alt="Akij Essential" class="brandlogo"></a>
    <div class="searchwrap">
      <span class="ic">&#128269;</span>
      <input id="search" type="text" placeholder="Search Device by Name or IP" oninput="doSearch()">
    </div>
    <button class="btn addbtn" onclick="openAdd()">+ Add Device</button>
  </div>
  <div class="abrow2">
    <div class="chips">
      <span class="chip alert" title="Devices + cameras needing attention">&#128276; Alerts <b id="chipAlerts">0</b></span>
      <span class="chip filterable" id="pillAll" onclick="setStatusFilter('all')" title="Show all devices">Total <b id="stTotal">0</b></span>
      <span class="chip on filterable" id="pillOn" onclick="openDevList('online')" title="Show online devices">Online <b id="stOn">0</b></span>
      <span class="chip off filterable" id="pillOff" onclick="openDevList('offline')" title="Show offline devices">Offline <b id="stOff">0</b></span>
      <span class="chip" title="Total cameras across all NVRs">Total Cam <b id="stTotalCam">0</b></span>
      <span class="chip on filterable" id="camOnChip" onclick="showCamList('online')" title="Show online cameras">Online Cam <b id="stOnCam">0</b></span>
      <span class="chip off filterable" id="camOffChip" onclick="showCamList('offline')" title="Show offline cameras">Offline Cam <b id="stOffCam">0</b></span>
      <span class="chip live"><span class="livedot"></span>Live</span>
    </div>
    <div class="chips rightend">
      <span class="chip" style="opacity:.7">Updated <b id="stUpd">--</b></span>
      <div class="user" id="userBox" onclick="toggleProfile(event)">
        <div class="uavatar" id="uAvatar">?</div>
        <div class="uinfo">
          <div class="uname" id="uName">--</div>
          <div class="urole" id="uRole">admin</div>
        </div>
        <span class="uchevs">&#9662;</span>
        <div class="profilemenu" id="profileMenu">
          <button onclick="openChangePw()">&#128273; Change Password</button>
          <button id="menuUserMgmt" onclick="openUserMgmt()" style="display:none">&#128101; User Management</button>
          <button onclick="doLogout()">&#128275; Sign out</button>
        </div>
      </div>
    </div>
  </div>
</header>

<div id="main"></div>
<div class="foot">Click a device card to view details &middot; Auto-refresh every 10s &middot; SNMP community: arlzabbix</div>

<div class="ov" id="ov">
  <div class="modal">
    <h3>Add New Device</h3>
    <div class="fld"><label>Device Name *</label><input id="fName" placeholder="e.g. AKIJ Flour (Router)"></div>
    <div class="fld"><label>IP Address *</label><input id="fIp" placeholder="e.g. 192.168.1.1"></div>
    <div class="fld"><label>ISP / Provider</label><input id="fIsp" placeholder="e.g. CCL-SIP"></div>
    <div class="fld"><label>Location</label><input id="fLoc" placeholder="e.g. Dhaka"></div>
    <div class="fld"><label>Check Type *</label>
      <select id="fType">
        <option value="snmp">SNMP (router / switch)</option>
        <option value="ping">Ping (attendance etc.)</option>
      </select>
    </div>
    <div class="mbtns">
      <button class="btn gray" onclick="closeAdd()">Cancel</button>
      <button class="btn" onclick="submitAdd()">Add Device</button>
    </div>
    <div class="msg" id="addMsg"></div>
  </div>
</div>

<div class="ov" id="camOv" onclick="if(event.target===this)closeCamList()">
  <div class="modal cam-modal">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <h3 id="camModalTitle" style="margin:0">Cameras</h3>
      <button class="btn gray" onclick="closeCamList()">Close</button>
    </div>
    <div id="camModalBody" class="camtable"></div>
  </div>
</div>

<div class="ov" id="devOv" onclick="if(event.target===this)closeDevList()">
  <div class="modal cam-modal">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <h3 id="devModalTitle" style="margin:0">Devices</h3>
      <button class="btn gray" onclick="closeDevList()">Close</button>
    </div>
    <div id="devModalBody" class="camtable"></div>
  </div>
</div>

<div class="ov" id="pwOv" onclick="if(event.target===this)closePw()">
  <div class="modal" style="max-width:420px">
    <h3 style="margin:0 0 16px">Change Password</h3>
    <div class="fld"><label>Current Password</label><input id="pwCur" type="password" autocomplete="current-password"></div>
    <div class="fld"><label>New Password</label><input id="pwNew" type="password" autocomplete="new-password"></div>
    <div class="fld"><label>Confirm New Password</label><input id="pwConfirm" type="password" autocomplete="new-password"></div>
    <div class="msg" id="pwMsg" style="min-height:16px"></div>
    <div class="mbtns">
      <button class="btn gray" onclick="closePw()">Cancel</button>
      <button class="btn" onclick="submitChangePw()">Update Password</button>
    </div>
  </div>
</div>

<div class="ov" id="usersOv" onclick="if(event.target===this)closeUsers()">
  <div class="modal cam-modal" style="max-width:780px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px">
      <h3 style="margin:0">User Management</h3>
      <button class="btn gray" onclick="closeUsers()">Close</button>
    </div>
    <div id="usersTable" class="camtable"></div>
    <div style="margin-top:16px;border-top:1px solid var(--line);padding-top:14px">
      <div style="font-weight:600;margin-bottom:10px" id="userFormTitle">Add User</div>
      <div class="fld"><label>Username *</label><input id="uUsername" placeholder="e.g. operator1"></div>
      <div class="fld"><label>Display Name</label><input id="uDisplay" placeholder="e.g. Main Gate Operator"></div>
      <div class="fld"><label>Password</label><input id="uPassword" type="password" placeholder="(leave blank to keep unchanged)"></div>
      <div class="fld"><label>Role</label><select id="uRole"><option value="user">user</option><option value="admin">admin</option></select></div>
      <div class="msg" id="userMsg" style="min-height:16px"></div>
      <div class="mbtns">
        <button class="btn gray" id="userCancelBtn" style="display:none" onclick="resetUserForm()">Cancel Edit</button>
        <button class="btn" id="userSaveBtn" onclick="saveUser()">Add User</button>
      </div>
    </div>
  </div>
</div>

<script>
const esc = s => String(s == null ? '--' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CATS = [
  { key: 'mikrotik', label: 'MikroTik Routers', icon: '&#128241;', tag: 'mt' },
  { key: 'ubiquiti', label: 'Ubiquiti Routers', icon: '&#128241;', tag: 'ub' },
  { key: 'switch',   label: 'LAN Switches', icon: '&#128450;', tag: 'cb' },
  { key: 'nvr',      label: 'NVR / CCTV', icon: '&#127909;', tag: '' },
  { key: 'other',    label: 'Other Devices', icon: '&#128268;', tag: '' },
  { key: 'ping',     label: 'Attendance Devices', icon: '&#128247;', tag: '' }
];
let searchQ = '';
let statusFilter = 'all';
function catOf(r){
  if (r.type === 'ping' && (r.isp||'').toLowerCase().indexOf('nvr') >= 0) return 'nvr';
  if (r.type === 'ping') return 'ping';
  if ((r.isp||'').toLowerCase().indexOf('switch')>=0) return 'switch';
  if (r.vendor === 'ubiquiti') return 'ubiquiti';
  if (r.vendor === 'mikrotik') return 'mikrotik';
  return 'other';
}
function brandOf(r){
  if (r.vendor === 'ubiquiti') return {label:'Ubiquiti', cls:'ub'};
  if (r.vendor === 'mikrotik') return {label:'MikroTik', cls:'mt'};
  if (r.vendor === 'cisco')    return {label:'Cisco', cls:'cb'};
  if ((r.isp||'').toLowerCase().indexOf('switch')>=0) return {label:'Switch', cls:'cb'};
  return null;
}
function vtagHtml(r){
  const b = brandOf(r);
  if (!b || !b.label) return '';
  return `<span class="vtag ${b.cls}">${b.label}</span>`;
}
function interfRows(r){
  if (!r.interfaces.length) return `<div class="off-msg">No interface data</div>`;
  return `<div class="scroll"><table><thead><tr><th>Interface</th><th>Link</th><th>RX</th><th>TX</th></tr></thead>
  <tbody>${r.interfaces.map(i=>`
    <tr><td>${esc(i.name)}</td>
      <td><span class="dot ${i.oper===1?'up':'down'}"></span>${i.oper===1?'Up':'Down'}</td>
      <td>${esc(i.rxRate || '--')} <span style="color:var(--mut)">(${esc(i.rx)})</span></td>
      <td>${esc(i.txRate || '--')} <span style="color:var(--mut)">(${esc(i.tx)})</span></td></tr>`).join('')}
  </tbody></table></div>`;
}
function devCard(r){
  const on = r.online;
  const q = searchQ.toLowerCase();
  const hay = (r.name+' '+r.isp+' '+r.ip+' '+r.location).toLowerCase();
  if (q && hay.indexOf(q) < 0) return '';
  const sub = r.location + ' &middot; ' + esc(r.ip);
  return `<div class="devcard ${on?'':'off'}" onclick="location.href='${r.hasNvr?'/nvr':'/device'}?id=${encodeURIComponent(r.id)}'">
    <div class="devhead">
      <span class="stDot ${on?'on':'off'}"></span>
      <div class="devinfo">
        <div class="devname">${esc(r.name)}${vtagHtml(r)} <span style="color:var(--mut);font-weight:400">(${esc(r.isp)})</span></div>
        <div class="devsub">${sub}</div>
      </div>
      <div class="devstat ${on?'on':'off'}">${on?'ONLINE':'OFFLINE'}</div>
      <span class="chint">&#9654;</span>
    </div>
  </div>`;
}
function setStatusFilter(f){
  statusFilter = (statusFilter === f && f !== 'all') ? 'all' : f;
  ['pillAll','pillOn','pillOff'].forEach(id => document.getElementById(id).classList.remove('active'));
  const map = { all:'pillAll', online:'pillOn', offline:'pillOff' };
  document.getElementById(map[statusFilter]).classList.add('active');
  refresh();
}
function statusMatch(r){
  if (statusFilter === 'online') return r.online;
  if (statusFilter === 'offline') return !r.online;
  return true;
}
function render(d){
  document.getElementById('stTotal').textContent = d.routers.length;
  const on = d.routers.filter(x=>x.online).length;
  document.getElementById('stOn').textContent = on;
  const offline = d.routers.length - on;
  document.getElementById('stOff').textContent = offline;
  document.getElementById('stUpd').textContent = new Date(d.generated).toLocaleTimeString();
  // Alerts = offline devices + offline cameras (updated by loadCamSummary)
  const offCam = parseInt(document.getElementById('stOffCam').textContent, 10) || 0;
  document.getElementById('chipAlerts').textContent = offline + offCam;
  let html = '';
  for (const c of CATS){
    const group = d.routers.filter(r=>catOf(r)===c.key && statusMatch(r) && !(searchQ && (r.name+' '+r.isp+' '+r.ip+' '+r.location).toLowerCase().indexOf(searchQ.toLowerCase()) < 0));
    if (!group.length) continue;
    const onN = group.filter(x=>x.online).length;
    html += `<div class="cathead"><h2>${c.icon} ${c.label}</h2><div class="ccount">${onN}/${group.length} online</div></div>
             <div class="cat">${group.map(devCard).join('')}</div>`;
  }
  let empty = 'No devices match your search.';
  if (statusFilter === 'offline') empty = 'No offline devices — all are online.';
  else if (statusFilter === 'online') empty = 'No online devices.';
  document.getElementById('main').innerHTML = html || `<div class="foot" style="margin-top:30px">${empty}</div>`;
}
function doSearch(){ searchQ = document.getElementById('search').value.trim(); refresh(); }
function openAdd(){ document.getElementById('ov').classList.add('show'); document.getElementById('addMsg').textContent=''; }
function closeAdd(){ document.getElementById('ov').classList.remove('show'); }
async function submitAdd(){
  const d = {
    name: document.getElementById('fName').value.trim(),
    ip: document.getElementById('fIp').value.trim(),
    isp: document.getElementById('fIsp').value.trim(),
    location: document.getElementById('fLoc').value.trim(),
    type: document.getElementById('fType').value
  };
  const msg = document.getElementById('addMsg');
  if (!d.name || !d.ip){ msg.style.color='var(--off)'; msg.textContent='Name and IP are required.'; return; }
  try {
    const r = await fetch('/api/add', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(d) });
    const j = await r.json();
    if (j.ok){ msg.style.color='var(--ok)'; msg.textContent='Device added. It will appear after next poll.'; setTimeout(()=>{ closeAdd(); refresh(); }, 1200); }
    else { msg.style.color='var(--off)'; msg.textContent='Error: '+j.error; }
  } catch(e){ msg.style.color='var(--off)'; msg.textContent='Error: '+e; }
}
async function removeDev(id){
  if (!confirm('Remove this device from dashboard?')) return;
  await fetch('/api/remove', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({id}) });
  refresh();
}
async function refresh(){
  try {
    const res = await fetch('/api/data');
    if (res.status === 401) { window.location.href = '/login'; return; }
    render(await res.json());
  } catch(e){ console.error(e); }
}
async function loadCamSummary(){
  try {
    const res = await fetch('/api/cameras-summary');
    if (res.status === 401) { window.location.href = '/login'; return; }
    const d = await res.json();
    document.getElementById('stTotalCam').textContent = d.total || 0;
    document.getElementById('stOnCam').textContent = d.online || 0;
    document.getElementById('stOffCam').textContent = d.offline || 0;
    // refresh alerts chip using the latest offline-camera count
    const offDev = parseInt(document.getElementById('stOff').textContent, 10) || 0;
    document.getElementById('chipAlerts').textContent = offDev + (d.offline || 0);
  } catch(e){ console.error(e); }
}
async function showCamList(filter){
  try {
    const res = await fetch('/api/cameras-summary');
    if (res.status === 401) { window.location.href = '/login'; return; }
    const d = await res.json();
    let list = (d.cameras || []);
    if (filter === 'online') list = list.filter(c => c.online === true);
    else if (filter === 'offline') list = list.filter(c => c.online === false);
    const title = filter === 'online' ? 'Online Cameras (' + list.length + ')'
                : filter === 'offline' ? 'Offline Cameras (' + list.length + ')'
                : 'All Cameras (' + list.length + ')';
    document.getElementById('camModalTitle').textContent = title;
    document.getElementById('camModalBody').innerHTML = list.length ? `<div class="camscroll"><table>
      <thead><tr><th>NVR</th><th>Ch</th><th>Camera Name</th><th>IP Address</th><th>Model</th><th>Status</th></tr></thead>
      <tbody>${list.map(c=>{
        const cls = c.online===true?'on':(c.online===false?'off':'');
        const txt = c.online===true?'Online':(c.online===false?'Offline':'Unknown');
        return `<tr>
          <td>${esc(c.nvr)}</td>
          <td>${esc(c.ch)}</td>
          <td>${esc(c.name)}</td>
          <td>${esc(c.ip)}</td>
          <td style="color:var(--mut)">${esc(c.model)}</td>
          <td><span class="cdot ${cls}"></span>${txt}</td></tr>`;
      }).join('')}</tbody></table></div>`
      : `<div class="foot" style="margin:20px 0">No cameras.</div>`;
    document.getElementById('camOv').classList.add('show');
  } catch(e){ console.error(e); }
}
function closeCamList(){ document.getElementById('camOv').classList.remove('show'); }
async function openDevList(filter){
  // Only open the list popup — the dashboard behind stays unchanged,
  // same behaviour as the Online Cam / Offline Cam chips.
  await renderDevList(filter);
}
async function renderDevList(filter){
  let d;
  try {
    const res = await fetch('/api/data');
    if (res.status === 401) { window.location.href = '/login'; return; }
    d = await res.json();
  } catch(e){ console.error(e); return; }
  let list = (d.routers || []);
  if (filter === 'online') list = list.filter(r => r.online);
  else if (filter === 'offline') list = list.filter(r => !r.online);
  const title = filter === 'online' ? 'Online Devices (' + list.length + ')'
              : filter === 'offline' ? 'Offline Devices (' + list.length + ')'
              : 'All Devices (' + list.length + ')';
  document.getElementById('devModalTitle').textContent = title;
  document.getElementById('devModalBody').innerHTML = list.length ? `<div class="camscroll"><table>
    <thead><tr><th>Status</th><th>Device Name</th><th>ISP / Type</th><th>IP Address</th><th>Location</th></tr></thead>
    <tbody>${list.map(r=>{
      const cls = r.online ? 'on' : 'off';
      const txt = r.online ? 'Online' : 'Offline';
      const href = (r.hasNvr ? '/nvr' : '/device') + '?id=' + encodeURIComponent(r.id);
      return `<tr style="cursor:pointer" onclick="location.href='${href}'">
        <td><span class="cdot ${cls}"></span>${txt}</td>
        <td>${esc(r.name)}</td>
        <td style="color:var(--mut)">${esc(r.isp)}</td>
        <td>${esc(r.ip)}</td>
        <td style="color:var(--mut)">${esc(r.location)}</td></tr>`;
    }).join('')}</tbody></table></div>`
    : `<div class="foot" style="margin:20px 0">No devices.</div>`;
  document.getElementById('devOv').classList.add('show');
}
function closeDevList(){ document.getElementById('devOv').classList.remove('show'); }

// ---- Change own password ----
function openChangePw(){
  document.getElementById('pwCur').value = '';
  document.getElementById('pwNew').value = '';
  document.getElementById('pwConfirm').value = '';
  const m = document.getElementById('pwMsg'); m.textContent = ''; m.style.color = '';
  document.getElementById('pwOv').classList.add('show');
}
function closePw(){ document.getElementById('pwOv').classList.remove('show'); }
async function submitChangePw(){
  const cur = document.getElementById('pwCur').value;
  const np = document.getElementById('pwNew').value;
  const cf = document.getElementById('pwConfirm').value;
  const m = document.getElementById('pwMsg');
  if (!cur || !np) { m.style.color = 'var(--off)'; m.textContent = 'All fields are required.'; return; }
  if (np !== cf) { m.style.color = 'var(--off)'; m.textContent = 'New passwords do not match.'; return; }
  try {
    const r = await fetch('/api/change-password', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ currentPassword: cur, newPassword: np }) });
    const j = await r.json();
    if (j.ok) { m.style.color = 'var(--ok)'; m.textContent = 'Password updated.'; setTimeout(closePw, 900); }
    else { m.style.color = 'var(--off)'; m.textContent = 'Error: ' + j.error; }
  } catch(e){ m.style.color = 'var(--off)'; m.textContent = 'Error: ' + e; }
}

// ---- User management (admin) ----
let usersCache = [];
let editingUser = null;
function openUserMgmt(){
  resetUserForm();
  document.getElementById('userMsg').textContent = '';
  document.getElementById('usersOv').classList.add('show');
  loadUsers();
}
function closeUsers(){ document.getElementById('usersOv').classList.remove('show'); }
async function loadUsers(){
  const body = document.getElementById('usersTable');
  try {
    const r = await fetch('/api/users');
    if (r.status === 401) { window.location.href = '/login'; return; }
    if (r.status === 403) { body.innerHTML = '<div class="foot" style="margin:16px 0">Admin access required.</div>'; return; }
    const d = await r.json();
    usersCache = d.users || [];
    if (!usersCache.length) { body.innerHTML = '<div class="foot" style="margin:16px 0">No users.</div>'; return; }
    body.innerHTML = '<table><thead><tr><th>Username</th><th>Name</th><th>Role</th><th>Actions</th></tr></thead><tbody>' +
      usersCache.map(u => {
        const me = u.username === d.me;
        return '<tr>' +
          '<td>' + esc(u.username) + (me ? ' <span style="color:var(--mut)">(you)</span>' : '') + '</td>' +
          '<td>' + esc(u.displayName) + '</td>' +
          '<td><span class="vtag ' + (u.role === 'admin' ? 'mt' : 'ub') + '" style="margin-left:0">' + esc(u.role) + '</span></td>' +
          '<td>' +
            '<button class="btn gray" style="padding:4px 10px;font-size:12px" data-u="' + esc(u.username) + '" onclick="editUser(this.dataset.u)">Edit</button> ' +
            (me ? '' : '<button class="btn gray" style="padding:4px 10px;font-size:12px;color:var(--off)" data-u="' + esc(u.username) + '" onclick="deleteUser(this.dataset.u)">Delete</button>') +
          '</td></tr>';
      }).join('') + '</tbody></table>';
  } catch(e){ console.error(e); body.innerHTML = '<div class="foot" style="margin:16px 0">Failed to load users.</div>'; }
}
function editUser(username){
  const u = usersCache.find(x => x.username === username);
  if (!u) return;
  editingUser = username;
  document.getElementById('uUsername').value = u.username;
  document.getElementById('uUsername').disabled = true;
  document.getElementById('uDisplay').value = u.displayName || '';
  document.getElementById('uPassword').value = '';
  document.getElementById('uRole').value = u.role || 'user';
  document.getElementById('userFormTitle').textContent = 'Edit User: ' + u.username;
  document.getElementById('userSaveBtn').textContent = 'Save Changes';
  document.getElementById('userCancelBtn').style.display = 'inline-block';
  document.getElementById('userMsg').textContent = '';
}
function resetUserForm(){
  editingUser = null;
  document.getElementById('uUsername').value = '';
  document.getElementById('uUsername').disabled = false;
  document.getElementById('uDisplay').value = '';
  document.getElementById('uPassword').value = '';
  document.getElementById('uRole').value = 'user';
  document.getElementById('userFormTitle').textContent = 'Add User';
  document.getElementById('userSaveBtn').textContent = 'Add User';
  const c = document.getElementById('userCancelBtn'); if (c) c.style.display = 'none';
}
async function saveUser(){
  const m = document.getElementById('userMsg');
  const username = document.getElementById('uUsername').value.trim();
  const displayName = document.getElementById('uDisplay').value.trim();
  const password = document.getElementById('uPassword').value;
  const role = document.getElementById('uRole').value;
  if (!username) { m.style.color = 'var(--off)'; m.textContent = 'Username is required.'; return; }
  if (!editingUser && !password) { m.style.color = 'var(--off)'; m.textContent = 'Password is required for a new user.'; return; }
  try {
    const r = editingUser
      ? await fetch('/api/users/update', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username: editingUser, displayName, role, password }) })
      : await fetch('/api/users', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username, displayName, password, role }) });
    const j = await r.json();
    if (j.ok) { m.style.color = 'var(--ok)'; m.textContent = editingUser ? 'User updated.' : 'User added.'; resetUserForm(); loadUsers(); }
    else { m.style.color = 'var(--off)'; m.textContent = 'Error: ' + j.error; }
  } catch(e){ m.style.color = 'var(--off)'; m.textContent = 'Error: ' + e; }
}
async function deleteUser(username){
  if (!confirm('Delete user "' + username + '"?')) return;
  try {
    const r = await fetch('/api/users/delete', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username }) });
    const j = await r.json();
    const m = document.getElementById('userMsg');
    if (j.ok) { m.style.color = 'var(--ok)'; m.textContent = 'User deleted.'; loadUsers(); }
    else { m.style.color = 'var(--off)'; m.textContent = 'Error: ' + j.error; }
  } catch(e){ console.error(e); }
}
async function loadMe(){
  try {
    const res = await fetch('/api/me');
    if (res.status === 401) { window.location.href = '/login'; return; }
    const d = await res.json();
    const name = d.displayName || d.username || 'User';
    document.getElementById('uName').textContent = name;
    document.getElementById('uRole').textContent = d.role || 'user';
    document.getElementById('uAvatar').textContent = name.charAt(0).toUpperCase();
    const mgmt = document.getElementById('menuUserMgmt');
    if (mgmt) mgmt.style.display = (d.role === 'admin') ? 'block' : 'none';
  } catch(e){ console.error(e); }
}
function toggleProfile(e){
  if (e) e.stopPropagation();
  document.getElementById('profileMenu').classList.toggle('show');
}
document.addEventListener('click', () => {
  const m = document.getElementById('profileMenu');
  if (m) m.classList.remove('show');
});
async function doLogout(){
  try { await fetch('/api/logout', { method: 'POST' }); } catch(e) {}
  window.location.href = '/login';
}
loadMe();
refresh();
loadCamSummary();
setInterval(refresh, 5000);
setInterval(loadCamSummary, 10000);
</script>
